services:
  - type: web
    name: guardian-cv
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app"
    healthCheckPath: /api/cv/runtime
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GUARDIAN_FORCE_HEURISTICS
        value: "True"
      - key: FLASK_ENV
        value: production
